<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<title>Deadlock: Circular Wait</title>
<desc>Compact wait-for graph: T1 waits for B, B is held by T2, T2 waits for A, and A is held by T1.</desc>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="60.0" y="42.0" font-family="monospace" font-size="24" font-weight="bold" fill="#212529">Deadlock: Circular Wait</text>
<rect x="120" y="105" width="140" height="84" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="138.0" y="135.0" font-family="monospace" font-size="15" font-weight="bold" fill="#212529">T1</text>
<text x="138.0" y="161.0" font-family="monospace" font-size="12" font-weight="normal" fill="#495057">thread</text>
<rect x="640" y="105" width="140" height="84" rx="18" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/>
<text x="658.0" y="135.0" font-family="monospace" font-size="15" font-weight="bold" fill="#212529">B</text>
<text x="658.0" y="161.0" font-family="monospace" font-size="12" font-weight="normal" fill="#495057">resource</text>
<rect x="640" y="315" width="140" height="84" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="658.0" y="345.0" font-family="monospace" font-size="15" font-weight="bold" fill="#212529">T2</text>
<text x="658.0" y="371.0" font-family="monospace" font-size="12" font-weight="normal" fill="#495057">thread</text>
<rect x="120" y="315" width="140" height="84" rx="18" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/>
<text x="138.0" y="345.0" font-family="monospace" font-size="15" font-weight="bold" fill="#212529">A</text>
<text x="138.0" y="371.0" font-family="monospace" font-size="12" font-weight="normal" fill="#495057">resource</text>
<line x1="260" y1="147" x2="640" y2="147" stroke="#c92a2a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowhead)"/>
<text x="432.0" y="133.0" font-family="monospace" font-size="12" font-weight="bold" fill="#c92a2a">waits</text>
<line x1="710" y1="189" x2="710" y2="315" stroke="#1864ab" stroke-width="3" marker-end="url(#arrowhead)"/>
<text x="728.0" y="252.0" font-family="monospace" font-size="12" font-weight="bold" fill="#1864ab">held</text>
<line x1="640" y1="357" x2="260" y2="357" stroke="#c92a2a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowhead)"/>
<text x="432.0" y="343.0" font-family="monospace" font-size="12" font-weight="bold" fill="#c92a2a">waits</text>
<line x1="190" y1="315" x2="190" y2="189" stroke="#1864ab" stroke-width="3" marker-end="url(#arrowhead)"/>
<text x="208.0" y="252.0" font-family="monospace" font-size="12" font-weight="bold" fill="#1864ab">held</text>
<rect x="334" y="226" width="232" height="68" rx="12" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="372.0" y="268.0" font-family="monospace" font-size="22" font-weight="bold" fill="#e67700">Circular Wait</text>
<line x1="282" y1="440" x2="322" y2="440" stroke="#1864ab" stroke-width="3"/>
<text x="334.0" y="445.0" font-family="monospace" font-size="12" font-weight="normal" fill="#212529">solid = held by</text>
<line x1="490" y1="440" x2="530" y2="440" stroke="#c92a2a" stroke-width="3" stroke-dasharray="7 5"/>
<text x="542.0" y="445.0" font-family="monospace" font-size="12" font-weight="normal" fill="#212529">dashed = waits for</text>
<text x="128.0" y="482.0" font-family="monospace" font-size="12" font-weight="normal" fill="#495057">T1=Worker-Thread-1, T2=Worker-Thread-2, A=Shared_Memory_A, B=Socket_Pool_B</text>
</svg>
